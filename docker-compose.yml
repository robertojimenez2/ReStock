services:
  postgres:
    image: postgres:17
    container_name: restock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restock
      POSTGRES_USER: restock
      POSTGRES_PASSWORD: restock_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: